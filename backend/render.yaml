# Blueprint do Render para o backend (API + webhook + cron da Meta).
# Em render.com: New > Blueprint > aponte para este repositório.
# Defina os valores de DATABASE_URL, DIRECT_URL, etc. no painel (sync: false).
services:
  - type: web
    name: aj-alpha-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SALES_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FB_ACCESS_TOKEN
        sync: false
      - key: FB_AD_ACCOUNT_ID
        sync: false
      - key: FB_GRAPH_VERSION
        value: v21.0
      - key: FB_ACCOUNT_TIMEZONE
        value: America/Sao_Paulo
